spring:
 application:
  name: api-gateway
spring:
 application:
  name: api-gateway
  eureka:
  client:
  service-url:
  defaultZone: http://localhost:8761/api-gateway
spring:
 cloud: 
  gateway:
    routes:
    - id: user-service
      uri: lb://USER-SERVICE
      predicates:
       Path: /users/**
    - id: task-service
      uri: lb://EUREKA-SERVICE
      predicates:
       Path: /tasks/**